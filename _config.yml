#
# Site Settings
#

title: Jae Wook Kim
name: Jae Wook Kim
description: Practical writing on developer experience, platform engineering, GitHub Actions, cloud infrastructure, and AI agents.
tagline: DevEx, platform engineering, cloud, and CI/CD
repository: iamjaekim/iamjaekim.github.io
author:
  name: Jae Wook Kim
  email: jaekim92@outlook.com
  url: https://iamjaekim.github.io

avatar: images/profile.webp
logo: images/default.svg
timezone: America/New_York
lang: en

url: https://iamjaekim.github.io
baseurl: ""
permalink: /:title/

footer-links:
  dribbble:
  email: jaekim92@outlook.com
  facebook:
  flickr:
  github: iamjaekim/iamjaekim.github.io
  instagram:
  linkedin: iamjaekim
  pinterest:
  rss: true
  twitter:
  stackoverflow:
  youtube:
  googleplus:

social:
  name: Jae Wook Kim
  links:
    - https://github.com/iamjaekim
    - https://www.linkedin.com/in/iamjaekim

google_analytics: "G-MJT8MKP4BN"
google_site_verification: "google8102e40b17e7e3da"
webmaster_verifications:
  google: "google8102e40b17e7e3da"

comments:
  provider: utterances
  utterances:
    repo: iamjaekim/iamjaekim.github.io
    issue_term: pathname
    theme: github-light
    label: blog-comment

twitter:
  card: summary

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      image: /images/default.svg
  - scope:
      path: ""
      type: pages
    values:
      layout: page

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    block:
      line_numbers: false

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag

paginate: 10
paginate_path: "/page:num/"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - aws_infra/
  - sample_project/
  - node_modules/
  - frontmatter.json
  - POST_TEMPLATE.md
  - scripts/
