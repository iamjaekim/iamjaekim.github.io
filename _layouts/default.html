<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include favicon.html %}
    {% include meta.html %}
    {% include analytics.html %}
    {% feed_meta %}
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ '/style.css' | relative_url }}">
    <link rel="stylesheet" type="text/css" href="{{ '/seo.css' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ '/feed.xml' | absolute_url }}">
  </head>

  <body>
    <header class="site-header" role="banner">
      <div class="container-wide">
        <a href="{{ '/' | relative_url }}" class="site-brand">
          <div class="site-avatar">
            <img src="{{ site.avatar | relative_url }}" alt="{{ site.name }}" width="36" height="36">
          </div>
          <span class="site-title">{{ site.name }}</span>
        </a>

        <button class="mobile-menu-toggle" aria-label="Toggle navigation" aria-expanded="false" onclick="toggleMenu(this)">☰</button>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
          <a href="{{ '/tags/' | relative_url }}" {% if page.url == '/tags/' %}class="active"{% endif %}>Topics</a>
          <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a>
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode"><span class="theme-toggle-text">Dark Mode</span></button>
        </nav>
      </div>
    </header>

    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        document.addEventListener('DOMContentLoaded', function() {
          var label = document.querySelector('.theme-toggle-text');
          if (label) label.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'Light Mode' : 'Dark Mode';
        });
      })();

      function toggleMenu(button) {
        var nav = document.querySelector('.site-nav');
        var open = nav.classList.toggle('open');
        button.setAttribute('aria-expanded', String(open));
      }

      function toggleTheme() {
        var html = document.documentElement;
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.querySelector('.theme-toggle-text').textContent = next === 'dark' ? 'Light Mode' : 'Dark Mode';
      }
    </script>

    <main class="site-content" role="main">
      <div class="container-wide">{{ content }}</div>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container-wide">
        <div class="footer-content">
          <div class="footer-text">&copy; {{ site.time | date: '%Y' }} {{ site.name }}. Built with Jekyll.</div>
          <div class="footer-links">
            <a href="{{ '/tags/' | relative_url }}">Topics</a>
            <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
            <a href="https://github.com/{{ site.footer-links.github }}" rel="me noopener">GitHub</a>
            <a href="https://www.linkedin.com/in/{{ site.footer-links.linkedin }}" rel="me noopener">LinkedIn</a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
